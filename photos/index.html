		<dialog class="lightbox" id="lightbox" aria-label="Expanded photo">
			<img id="lightbox-img" src="" alt="" />
			<button type="button" class="lightbox-button lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
			<button type="button" class="lightbox-button lightbox-prev" id="lightbox-prev" aria-label="Previous photo">&lsaquo;</button>
			<button type="button" class="lightbox-button lightbox-next" id="lightbox-next" aria-label="Next photo">&rsaquo;</button>
		</dialog>

		<script>
			(function () {
				var dialog = document.getElementById("lightbox");
				var expanded = document.getElementById("lightbox-img");
				var cells = Array.prototype.slice.call(
					document.querySelectorAll(".photo-grid button")
				);
				var current = 0;

				function show(index) {
					current = (index + cells.length) % cells.length;
					var thumb = cells[current].querySelector("img");
					expanded.src = thumb.src;
					expanded.alt = thumb.alt;
				}

				cells.forEach(function (cell, index) {
					cell.addEventListener("click", function () {
						show(index);
						dialog.showModal();
					});
				});

				document.getElementById("lightbox-close").addEventListener("click", function () {
					dialog.close();
				});

				document.getElementById("lightbox-prev").addEventListener("click", function () {
					show(current - 1);
				});

				document.getElementById("lightbox-next").addEventListener("click", function () {
					show(current + 1);
				});

				dialog.addEventListener("click", function (event) {
					if (event.target === dialog) {
						dialog.close();
					}
				});

				document.addEventListener("keydown", function (event) {
					if (!dialog.open) return;
					if (event.key === "ArrowLeft") show(current - 1);
					if (event.key === "ArrowRight") show(current + 1);
				});
			})();
		</script>
